[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightrag-mcp-server"
version = "0.1.0"
description = "LightRAG Model Context Protocol (MCP) Server - Provides intelligent knowledge graph access through MCP tools"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LightRAG Team", email = "dev@lightrag.io" }
]
maintainers = [
    { name = "LightRAG Team", email = "dev@lightrag.io" }
]
keywords = [
    "lightrag",
    "mcp",
    "model-context-protocol",
    "knowledge-graph",
    "rag",
    "ai",
    "nlp",
    "semantic-search"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.10"

# Core dependencies for MCP server functionality
dependencies = [
    # MCP Protocol
    "mcp>=1.0.0",

    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # HTTP Client for LightRAG API
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Data Models & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Session & Caching
    "redis>=5.0.0",
    "aioredis>=2.0.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",

    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # Utilities
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dateutil>=2.8.2",

    # Async Support
    "asyncio-mqtt>=0.16.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",  # For testing HTTP clients

    # Code Quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "bandit>=1.7.5",

    # Pre-commit Hooks
    "pre-commit>=3.6.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",

    # Development Tools
    "ipython>=8.17.0",
    "jupyter>=1.0.0",
]

# Production deployment dependencies
production = [
    "gunicorn>=21.2.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk[fastapi]>=1.38.0",
]

# All dependencies for complete development environment
all = [
    "lightrag-mcp-server[dev,production]"
]

[project.urls]
Homepage = "https://github.com/LightRAG-team/LightRAG"
Documentation = "https://lightrag.readthedocs.io/"
Repository = "https://github.com/LightRAG-team/LightRAG"
"Bug Tracker" = "https://github.com/LightRAG-team/LightRAG/issues"
Changelog = "https://github.com/LightRAG-team/LightRAG/blob/main/CHANGELOG.md"

[project.scripts]
lightrag-mcp = "lightrag_mcp.main:app"
lightrag-mcp-server = "lightrag_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lightrag_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "lightrag_mcp/",
    "tests/",
    "README.md",
    "LICENSE",
]

# Black code formatting configuration
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort import sorting configuration
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
src_paths = ["lightrag_mcp", "tests"]

# MyPy type checking configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "redis.*",
    "aioredis.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=lightrag_mcp",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
    "auth: marks tests related to authentication",
    "mcp: marks tests related to MCP protocol",
    "benchmark: marks tests as performance benchmarks",
]

# Coverage configuration
[tool.coverage.run]
source = ["lightrag_mcp"]
omit = [
    "lightrag_mcp/__pycache__/*",
    "tests/*",
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit security linting configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.2.0",
    "isort>=6.0.1",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "psutil>=7.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.2.1",
]

# Flake8 configuration (in setup.cfg or .flake8 file)
# Note: Flake8 doesn't support pyproject.toml natively yet
