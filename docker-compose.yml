version: '3.8'

networks:
  proxy:
    external: true
    name: traefik_proxy
  default:
    driver: bridge

services:
  # Development profile - maintains current workflow
  lightrag-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    image: lightrag-server:dev
    container_name: lightrag-dev
    ports:
      - "${PORT:-9621}:${PORT:-9621}"
    volumes:
      - ${LIGHTRAG_WORKING_DIR:-./data/rag_storage}:/app/data/rag_storage
      - ${LIGHTRAG_INPUT_DIR:-./data/inputs}:/app/data/inputs
      - ${LIGHTRAG_CONTEXTS_DIR:-./data/contexts}:/app/data/contexts
      # Mount the default context subdirectories properly including its input directories for context changes after startup
      - ${LIGHTRAG_WORKING_DIR:-./data/rag_storage}:/app/data/contexts/default
      - ${LIGHTRAG_INPUT_DIR:-./data/inputs}:/app/data/contexts/default_inputs
    env_file:
      - .env
    # Add host.docker.internal mapping for Ollama when using local LLM
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["python", "-m", "lightrag.api.lightrag_server"]
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          memory: ${MEMORY_RESERVATION:-4G}

  # CI profile - for build testing and SBOM generation
  lightrag-ci:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: lightrag-server:ci
    container_name: lightrag-ci
    environment:
      - NODE_ENV=production
    volumes:
      - ./ci-reports:/app/reports
    command: ["echo", "CI build complete"]

  # Production profile - integrated WebUI container
  lightrag-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: lightrag-server:prod
    container_name: lightrag
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CORS_ORIGINS=https://lightrag.flipgoal.xyz
      - TOKEN_SECRET_FILE=/run/secrets/token_secret
      - AUTH_FILE=/run/secrets/auth_users
      - LIGHTRAG_API_KEY_FILE=/run/secrets/api_key
    secrets:
      - token_secret
      - auth_users
      - api_key
    volumes:
      - ${LIGHTRAG_WORKING_DIR:-./data/rag_storage}:/app/data/rag_storage
      - ${LIGHTRAG_INPUT_DIR:-./data/inputs}:/app/data/inputs
      - ${LIGHTRAG_CONTEXTS_DIR:-./data/contexts}:/app/data/contexts
      - ${LIGHTRAG_WORKING_DIR:-./data/rag_storage}:/app/data/contexts/default
      - ${LIGHTRAG_INPUT_DIR:-./data/inputs}:/app/data/contexts/default_inputs
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lightrag.rule=Host(`lightrag.flipgoal.xyz`)"
      - "traefik.http.routers.lightrag.entrypoints=websecure"
      - "traefik.http.routers.lightrag.tls.certresolver=le"
      - "traefik.http.routers.lightrag.middlewares=redirect-to-https@file,sec-headers@file,ratelimit@file"
      - "traefik.http.services.lightrag.loadbalancer.server.port=9621"
      - "traefik.docker.network=traefik_proxy"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          memory: ${MEMORY_RESERVATION:-4G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9621/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Docker secrets for production
secrets:
  token_secret:
    file: ./secrets/token_secret
  auth_users:
    file: ./secrets/auth_users
  api_key:
    file: ./secrets/api_key

volumes:
  lightrag_data:
    driver: local