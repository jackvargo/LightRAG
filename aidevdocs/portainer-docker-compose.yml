version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - traefik_proxy
    environment:
      - PORTAINER_HTTP_DISABLED=true  # Force HTTPS
    labels:
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      
      # HTTPS Router
      - "traefik.http.routers.portainer.rule=Host(`portainer.flipgoal.xyz`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=le"
      - "traefik.http.routers.portainer.service=portainer-svc"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
      
      # Security Headers Middleware
      - "traefik.http.middlewares.portainer-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.portainer-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.portainer-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.portainer-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.portainer-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.portainer-secure-headers.headers.stsSeconds=31536000"
      
      # Apply Security Headers
      - "traefik.http.routers.portainer.middlewares=portainer-secure-headers"
      
      # HTTP Router (for redirect)
      - "traefik.http.routers.portainer-http.rule=Host(`portainer.flipgoal.xyz`)"
      - "traefik.http.routers.portainer-http.entrypoints=web"
      - "traefik.http.middlewares.portainer-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.portainer-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.portainer-http.middlewares=portainer-redirect"

volumes:
  portainer_data:
    driver: local

networks:
  traefik_proxy:
    external: true