name: LightRAG MCP Server CI/CD

on:
  push:
    branches: [ main, develop, feature/mcp-* ]
    paths:
      - 'lightrag_mcp/**'
      - '.github/workflows/mcp-ci.yml'
      - 'tests/mcp/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'lightrag_mcp/**'
      - '.github/workflows/mcp-ci.yml'
      - 'tests/mcp/**'

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.15"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Cache pre-commit hooks
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-

    - name: Run pre-commit hooks
      run: |
        source .venv/bin/activate
        pre-commit run --all-files --verbose

    - name: Check code formatting with Black
      run: |
        source .venv/bin/activate
        black --check --diff .

    - name: Check import sorting with isort
      run: |
        source .venv/bin/activate
        isort --check-only --diff .

    - name: Lint with flake8
      run: |
        source .venv/bin/activate
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type checking with mypy
      run: |
        source .venv/bin/activate
        mypy . --ignore-missing-imports

  security-checks:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run bandit security checks
      run: |
        source .venv/bin/activate
        pip install bandit[toml]
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt

    - name: Upload bandit results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-report
        path: lightrag_mcp/bandit-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Create test environment
      run: |
        cp .env.test .env

    - name: Run unit tests with pytest
      run: |
        source .venv/bin/activate
        pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./lightrag_mcp/coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Create test environment
      run: |
        cp .env.test .env
        # Override Redis URL for GitHub Actions
        echo "REDIS_URL=redis://localhost:6379/0" >> .env

    - name: Wait for Redis
      run: |
        timeout 30s bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

    - name: Run integration tests
      run: |
        source .venv/bin/activate
        pytest tests/integration/ -v --tb=short
      env:
        REDIS_URL: redis://localhost:6379/0

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Build package
      run: |
        cd lightrag_mcp
        uv build

    - name: Verify package contents
      run: |
        cd lightrag_mcp
        python -m pip install dist/*.whl
        python -c "import lightrag_mcp; print(f'Package version: {lightrag_mcp.__version__}')"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mcp-server-package
        path: |
          lightrag_mcp/dist/*.whl
          lightrag_mcp/dist/*.tar.gz

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-verification]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./lightrag_mcp
        push: false
        tags: lightrag-mcp-server:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm lightrag-mcp-server:test python -c "import lightrag_mcp; print('Docker build successful')"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run safety check
      run: |
        source .venv/bin/activate
        pip install safety
        safety check --json --output safety-report.json || true
        safety check

    - name: Upload safety results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: safety-audit-report
        path: lightrag_mcp/safety-report.json

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [integration-tests]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./lightrag_mcp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Install performance testing tools
      run: |
        source .venv/bin/activate
        pip install pytest-benchmark locust

    - name: Run performance benchmarks
      run: |
        source .venv/bin/activate
        pytest tests/performance/ -v --benchmark-only --benchmark-json=benchmark-results.json
      env:
        REDIS_URL: redis://localhost:6379/1

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: performance-benchmark-results
        path: lightrag_mcp/benchmark-results.json

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install documentation dependencies
      run: |
        cd lightrag_mcp
        uv sync --dev
        source .venv/bin/activate
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        cd lightrag_mcp
        source .venv/bin/activate
        sphinx-build -b html docs/ docs/_build/html

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: lightrag_mcp/docs/_build/html

  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [code-quality, unit-tests, integration-tests, security-checks, docker-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify all checks passed
      run: |
        echo "✅ All CI/CD checks passed successfully!"
        echo "🚀 MCP Server is ready for deployment"

    - name: Create deployment artifact
      run: |
        echo "MCP_SERVER_VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}" >> deployment.env
        echo "DEPLOYMENT_READY=true" >> deployment.env

    - name: Upload deployment metadata
      uses: actions/upload-artifact@v3
      with:
        name: deployment-metadata
        path: deployment.env

  notify-status:
    name: Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [code-quality, unit-tests, integration-tests, build-verification]

    steps:
    - name: Notify on success
      if: needs.code-quality.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
      run: |
        echo "🎉 LightRAG MCP Server CI/CD pipeline completed successfully!"

    - name: Notify on failure
      if: needs.code-quality.result == 'failure' || needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure'
      run: |
        echo "❌ LightRAG MCP Server CI/CD pipeline failed. Please check the logs."
        exit 1
