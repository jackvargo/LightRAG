version: '3.8'

services:
  traefik:
    image: traefik:v3.4.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard (secured with auth)
    environment:
      # Let's Encrypt configuration
      - ACME_EMAIL=${ACME_EMAIL:-admin@flipgoal.xyz}
      # Optional: Cloudflare DNS challenge (if using Cloudflare)
      # - CF_API_EMAIL=${CF_API_EMAIL}
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      # API and dashboard
      - --api.dashboard=true
      - --api.insecure=false
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_proxy
      # File provider for dynamic configuration
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      # Entry points
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt certificate resolver
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@flipgoal.xyz}
      - --certificatesresolvers.le.acme.storage=/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Optional: DNS challenge for wildcard certificates
      # - --certificatesresolvers.le.acme.dnschallenge=true
      # - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # Logging
      - --log.level=DEBUG  # Increased logging for troubleshooting
      - --accesslog=true
      - --accesslog.format=json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/acme.json:/acme.json
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./auth:/etc/traefik/auth:ro
    labels:
      - "traefik.enable=true"
      
      # Security Headers for Traefik Dashboard
      - "traefik.http.middlewares.traefik-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.traefik-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.traefik-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.traefik-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.traefik-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.traefik-secure-headers.headers.stsSeconds=31536000"
      
      # HTTPS Dashboard Router
      - "traefik.http.routers.dashboard.rule=Host(`traefik.flipgoal.xyz`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=traefik-auth@file"
      
      # HTTP Dashboard Router (for redirect)
      - "traefik.http.routers.dashboard-http.rule=Host(`traefik.flipgoal.xyz`)"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.middlewares.dashboard-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.dashboard-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.dashboard-http.middlewares=dashboard-redirect"
      
      # Global HTTP to HTTPS Redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=https-redirect"

networks:
  traefik_proxy:
    external: true
    attachable: true 