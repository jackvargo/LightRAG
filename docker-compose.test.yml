version: '3.8'

services:
  redis-test:
    image: redis:7-alpine
    container_name: lightrag-redis-test
    ports:
      - "6380:6379"  # Use different port for testing
    command: redis-server --appendonly yes
    volumes:
      - redis-test-data:/data
    networks:
      - mcp-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock LightRAG API service for testing
  lightrag-mock:
    image: mockserver/mockserver:latest
    container_name: lightrag-mock-api
    ports:
      - "9622:1080"  # Use different port for testing
    environment:
      MOCKSERVER_SERVER_PORT: 1080
      MOCKSERVER_LOG_LEVEL: INFO
    networks:
      - mcp-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-test-data:
    driver: local

networks:
  mcp-test-network:
    driver: bridge
